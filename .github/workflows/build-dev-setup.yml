name: Build Skyview Dev Setup
on:
  push:
    branches: [main, 'release/v1.1.*', 'release/v1.2.*']
    tags: ['v1.1.*', 'v1.2.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: dev-setup-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: installer/package-lock.json
      - run: npm ci && npm test && npm run build && npm audit --audit-level=high
        working-directory: installer
      - name: Bash static analysis and integrity
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --external-sources --severity=warning linux/*.sh linux/lib/*.sh
          python3 tests/backend_contracts.py
          python3 -m unittest discover -s tests -p 'test_metadata.py'
          python3 -m unittest discover -s tests -p 'test_linux_runtime.py'
          cd linux
          sha256sum --check SHA256SUMS
      - name: Validate Actions definitions
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
      - name: Browser accessibility and interaction checks
        working-directory: installer
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: ui-verification
          path: installer/test-results/
          if-no-files-found: error
  update-trust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: updater -> target
      - name: Native cross-process coordination contracts
        env:
          SDE_REQUIRE_COORDINATION: ${{ runner.os == 'Windows' && '1' || '' }}
        run: |
          cargo test --locked --manifest-path coordination/Cargo.toml
          cargo fmt --manifest-path coordination/Cargo.toml --check
          cargo clippy --locked --manifest-path coordination/Cargo.toml --all-targets -- -D warnings
      - name: Root-owned coordination contracts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo env "PATH=$PATH" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" SDE_REQUIRE_COORDINATION=1 cargo test --locked --manifest-path coordination/Cargo.toml
          sudo env SDE_REQUIRE_COORDINATION=1 python3 -m unittest discover -s tests -p 'test_coordination.py'
      - name: Native Minisign interoperability dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Signature and tampering contracts
        env:
          SDE_REQUIRE_MINISIGN_INTEROP: ${{ runner.os == 'Linux' && '1' || '' }}
        run: cargo test --locked --manifest-path updater/Cargo.toml
      - name: Root-owned staging and cleanup contracts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo env "PATH=$PATH" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" SDE_REQUIRE_PROTECTED_STAGING=1 cargo test --locked --manifest-path updater/Cargo.toml staging::tests -- --nocapture
      - name: Verifier formatting and static analysis
        run: |
          cargo fmt --manifest-path updater/Cargo.toml --check
          cargo clippy --locked --manifest-path updater/Cargo.toml --all-targets -- -D warnings
      - name: Build pinned-key verifier
        run: cargo build --release --locked --manifest-path updater/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sde-update-trust-${{ runner.os }}
          path: |
            updater/target/release/sde-update-trust
            updater/target/release/sde-update-trust.exe
          if-no-files-found: error
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            bundle: nsis
            asset: Skyview-Dev-Setup-Windows-x64.exe
          - os: ubuntu-24.04
            bundle: deb
            asset: Skyview-Dev-Setup-LinuxMint-amd64.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: installer/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            installer/src-tauri -> target
            updater -> target
          cache-on-failure: true
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Initialize coordination on disposable native runners
        run: cargo build --release --locked --manifest-path coordination/Cargo.toml
      - name: Prepare Windows coordination fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./coordination/target/release/sde-coordination.exe init
          if ($LASTEXITCODE -ne 0) { throw 'Coordination initialization failed.' }
      - name: Prepare Linux coordination fixtures
        if: runner.os == 'Linux'
        run: sudo coordination/target/release/sde-coordination init
      - name: Package the existing Chocolatey backend
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco pack windows/chocolatey/skyview-student-dev.nuspec --outputdirectory windows
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey packaging failed.' }
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $errors = Invoke-ScriptAnalyzer -Path windows -Recurse -Severity Error
          if ($errors) { $errors | Format-Table; throw 'PowerShell analysis failed.' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tests/Test-CoordinationCI.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Coordination supervision failed.' }
          ./tests/Test-BackendContracts.ps1
          ./tests/Test-MetadataContracts.ps1
          ./tests/Test-MaintenanceCI.ps1
      - run: npm ci
        working-directory: installer
      - name: Bundle external Windows maintenance worker
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked --manifest-path updater/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Maintenance worker build failed.' }
          Copy-Item updater/target/release/sde-update-trust.exe windows/self-update/sde-update-trust.exe
      - name: Build native installer
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}
        working-directory: installer
      - name: Verify Windows installer version
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = (Get-Content installer/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $packages = @(Get-ChildItem installer/src-tauri/target/release/bundle/nsis/*.exe)
          if ($packages.Count -ne 1) { throw 'Expected one Windows installer.' }
          $actual = $packages[0].VersionInfo.ProductVersion
          if ($actual -ne $expected) { throw 'Windows installer version does not match the application.' }
      - name: Verify package contents and stage release asset
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t packages < <(find installer/src-tauri/target/release/bundle/"$BUNDLE" -maxdepth 1 -type f \( -name '*.exe' -o -name '*.deb' \))
          test "${#packages[@]}" = 1
          test -s "${packages[0]}"
          cp "${packages[0]}" "dist/$ASSET"
          if [ "$BUNDLE" = deb ]; then
            dpkg-deb --info "dist/$ASSET"
            dpkg-deb --contents "dist/$ASSET" > dist/package-contents.txt
            cat dist/package-contents.txt
            grep -q 'usr/bin/skyview-dev-setup' dist/package-contents.txt
            grep -Fq 'usr/lib/Skyview Dev Setup/backend/linux/Install-SkyviewStudentDev.sh' dist/package-contents.txt
          fi
          cd dist
          sha256sum "$ASSET" > "$ASSET.sha256"
          sha256sum --check "$ASSET.sha256"
      - name: Verify Windows application bootstrap without applying a baseline
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $baseline = 'C:\ProgramData\SkyviewRobotics\Update-SkyviewTools.ps1'
          if (Test-Path $baseline) { throw 'Expected an app-only bootstrap fixture.' }
          if (Get-ScheduledTask -TaskName 'Skyview Robotics - Dev Tool Updates' -ErrorAction SilentlyContinue) { throw 'Unexpected existing baseline maintenance task.' }
          $installer = (Resolve-Path 'dist/Skyview-Dev-Setup-Windows-x64.exe').Path
          $process = Start-Process $installer -ArgumentList '/S','/UPDATE' -Wait -PassThru
          if ($process.ExitCode -notin @(0,3010)) {
            # Installer has finished. Invoke only the installed narrow bootstrap
            # on this disposable runner to surface NSIS's hidden hook diagnostic.
            Get-Content 'C:\Program Files\Skyview Dev Setup\sde-bootstrap.log' -ErrorAction SilentlyContinue
            Get-Content 'C:\Program Files\Skyview Dev Setup\backend\windows\self-update\bootstrap-error.log' -ErrorAction SilentlyContinue
            $init = Start-Process 'C:\Program Files\Skyview Dev Setup\skyview-dev-setup.exe' -ArgumentList '--coordination-init' -Wait -PassThru
            Write-Output "Installed coordination init diagnostic exit=$($init.ExitCode)"
            & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'C:\Program Files\Skyview Dev Setup\backend\windows\self-update\Bootstrap-SkyviewSelfUpdate.ps1'
            Write-Output "Installed 64-bit bootstrap diagnostic exit=$LASTEXITCODE"
            throw "Application bootstrap failed: $($process.ExitCode)"
          }
          if (Test-Path $baseline) { throw 'App-only installation applied a maintenance baseline.' }
          if (Get-ScheduledTask -TaskName 'Skyview Robotics - Dev Tool Updates' -ErrorAction SilentlyContinue) { throw 'App-only installation scheduled tool maintenance.' }
          $status = & ./coordination/target/release/sde-coordination.exe status | ConvertFrom-Json
          if ($status -ne 'idle') { throw "Application bootstrap left unsafe coordination: $status" }
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Skyview Dev Setup'
          $expected = (Get-Content installer/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ((Get-ItemProperty $key).DisplayVersion -ne $expected) { throw 'Installed application version mismatch.' }
          $policy = Get-Content 'C:\ProgramData\SkyviewRobotics\SelfUpdate\policy.json' -Raw | ConvertFrom-Json
          if ($policy.schemaVersion -ne 1 -or $policy.paused -ne $true) { throw 'Production rollout must default to paused.' }
          # Exercise replacement of existing receipts before long provisioning.
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File 'C:\Program Files\Skyview Dev Setup\backend\windows\self-update\Bootstrap-SkyviewSelfUpdate.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Repeated bootstrap receipt activation failed.' }
          if (Test-Path $baseline) { throw 'Repeated bootstrap applied a maintenance baseline.' }
          if (Get-ScheduledTask -TaskName 'Skyview Robotics - Dev Tool Updates' -ErrorAction SilentlyContinue) { throw 'Repeated bootstrap registered tool maintenance.' }
          $env:SDE_APPONLY_IDENTITY_FIXTURE = 'true'
          try {
            # Public fixture permissions only; no environment/credentials.
            foreach ($path in @('C:\Program Files\Skyview Dev Setup','C:\Program Files\Skyview Dev Setup\skyview-dev-setup.exe')) {
              Write-Output "Installed permission diagnostic: $path"
              Write-Output (Get-Acl -LiteralPath $path).Sddl
            }
            cargo test --locked --manifest-path updater/Cargo.toml --lib host::tests::installed_native_fixture_identity -- --exact --nocapture
            if ($LASTEXITCODE -ne 0) { throw 'Installed native identity failed before provisioning.' }
          } finally { Remove-Item Env:SDE_APPONLY_IDENTITY_FIXTURE }
      - name: Rust tests
        run: cargo test --locked -- --nocapture
        working-directory: installer/src-tauri
      - name: Build unpublished newer Windows fixture and verify signed SYSTEM upgrade
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $override = Join-Path $env:RUNNER_TEMP 'sde-native-fixture.json'
          '{"version":"1.2.2"}' | Set-Content $override -Encoding utf8
          npm --prefix installer run tauri build -- --config $override --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Newer native fixture build failed.' }
          $fixture = Join-Path $env:RUNNER_TEMP 'sde-newer-fixture'
          New-Item -ItemType Directory $fixture | Out-Null
          $package = @(Get-ChildItem installer/src-tauri/target/release/bundle/nsis/*1.2.2*.exe)
          if ($package.Count -ne 1) { throw 'Expected one newer fixture installer.' }
          Copy-Item $package[0].FullName (Join-Path $fixture 'Skyview-Dev-Setup-Windows-x64.exe')
          cargo test --locked --manifest-path updater/Cargo.toml --no-run --message-format json | Set-Content (Join-Path $env:RUNNER_TEMP 'sde-test-build.jsonl')
          if ($LASTEXITCODE -ne 0) { throw 'Native test binary build failed.' }
          $binaries = @(Get-Content (Join-Path $env:RUNNER_TEMP 'sde-test-build.jsonl') | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.target.kind -contains 'lib' -and $_.executable })
          if ($binaries.Count -ne 1) { throw 'Expected one native updater test binary.' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/Test-WindowsSelfUpdateCI.ps1 -FixtureRoot $fixture -TestExecutable $binaries[0].executable
          if ($LASTEXITCODE -ne 0) { throw 'Required signed SYSTEM upgrade failed.' }
      - name: Verify Linux application bootstrap without applying a baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test ! -e /var/lib/skyview-robotics/student-dev/version
          sudo apt-get install -y ./dist/Skyview-Dev-Setup-LinuxMint-amd64.deb
          test -r /var/lib/skyview-robotics-coordination/sessions.gate
          test -r /var/lib/skyview-robotics-coordination/operations.gate
          test "$(coordination/target/release/sde-coordination status)" = '"idle"'
          test ! -e /var/lib/skyview-robotics/student-dev/version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
          if-no-files-found: error
  release:
    needs: [checks, native, update-trust]
    if: startsWith(github.ref, 'refs/tags/v1.1.') || startsWith(github.ref, 'refs/heads/release/v1.1.') || startsWith(github.ref, 'refs/tags/v1.2.') || startsWith(github.ref, 'refs/heads/release/v1.2.')
    runs-on: ubuntu-24.04
    environment: sde-release-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Skyview-Dev-Setup-*
          path: dist
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - name: Build release verifier from reviewed source
        run: cargo build --release --locked --manifest-path updater/Cargo.toml
      - name: Verify both installers before publishing
        run: |
          set -euo pipefail
          cd dist
          test -s Skyview-Dev-Setup-Windows-x64.exe
          test -s Skyview-Dev-Setup-LinuxMint-amd64.deb
          sha256sum --check Skyview-Dev-Setup-Windows-x64.exe.sha256
          sha256sum --check Skyview-Dev-Setup-LinuxMint-amd64.deb.sha256
          cat Skyview-Dev-Setup-Windows-x64.exe.sha256 Skyview-Dev-Setup-LinuxMint-amd64.deb.sha256 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Create authenticated release metadata
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#release/}"
          python3 tests/release_identity.py "$tag"
          test "$(dpkg-deb -f dist/Skyview-Dev-Setup-LinuxMint-amd64.deb Package)" = skyview-dev-setup
          test "$(dpkg-deb -f dist/Skyview-Dev-Setup-LinuxMint-amd64.deb Architecture)" = amd64
          test "$(dpkg-deb -f dist/Skyview-Dev-Setup-LinuxMint-amd64.deb Version)" = "${tag#v}"
          updater/target/release/sde-update-trust create dist "$tag"
      - name: Sign and verify before publication
        shell: bash
        env:
          SDE_UPDATE_SIGNING_KEY: ${{ secrets.SDE_UPDATE_SIGNING_KEY }}
          SDE_UPDATE_SIGNING_PASSWORD: ${{ secrets.SDE_UPDATE_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#release/}"
          updater/target/release/sde-update-trust sign dist "$tag"
          updater/target/release/sde-update-trust verify dist "$tag"
      - name: Publish mentor-testing prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF" == refs/heads/release/v1.* ]]; then
            tag="${GITHUB_REF_NAME#release/}"
            if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
              test "$existing" = "$GITHUB_SHA"
            else
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
            fi
          fi
          gh release create "$tag" \
            dist/Skyview-Dev-Setup-Windows-x64.exe \
            dist/Skyview-Dev-Setup-LinuxMint-amd64.deb dist/SHA256SUMS.txt \
            dist/sde-update.json dist/sde-update.json.minisig \
            --verify-tag --prerelease \
            --title "Skyview Student Development Environment ${tag#v}" \
            --notes-file "docs/RELEASE-NOTES-${tag#v}.md"
